<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompts Gemini</title>
<!-- Les prompts Gemini du jeu, à copier d'un toucher depuis le téléphone, un onglet par famille.
     Bâtiments et Meubles : même contenu que les fiches « Prompts Gemini : bâtiments » et « Prompts Gemini : meubles »
     (docs Claude) : garder la page et les fiches d'accord. Les autres onglets (demande de Yo, 7 octobre 2026) :
     tout le Grand Carnet, dans prompts-carnet.js. -->
<style>
:root{
  --bg:#F6F1E7; --card:#FFFDF8; --ink:#3B2A1A; --muted:#7A6652; --line:#E6D9C3;
  --prompt:#F3EADA; --accent:#2F6B3A; --on-accent:#FFFFFF; --done:#2F6B3A; --chip:#EFE3CD;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1612; --card:#241E18; --ink:#F1E6D4; --muted:#B9A68E; --line:#3A3027;
    --prompt:#2E261E; --accent:#6DB47A; --on-accent:#0E1A12; --done:#6DB47A; --chip:#3A3027;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1612; --card:#241E18; --ink:#F1E6D4; --muted:#B9A68E; --line:#3A3027;
  --prompt:#2E261E; --accent:#6DB47A; --on-accent:#0E1A12; --done:#6DB47A; --chip:#3A3027;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(32px + env(safe-area-inset-bottom,0px))}
h1{font-size:26px;line-height:1.2;margin:8px 0 4px}
.lead{color:var(--muted);margin:0 0 12px}
.steps{margin:0 0 12px;padding-left:22px}
.steps li{margin:2px 0}
.progress{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0;border-bottom:1px solid var(--line);font-weight:600}
h2{font-size:20px;margin:24px 0 8px}
.note{color:var(--muted);font-size:14px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:0 0 12px}
.card.is-done{border-color:var(--done)}
.head{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin:0 0 8px}
.head h3{font-size:18px;margin:0;line-height:1.25}
.size{flex:none;background:var(--chip);border-radius:999px;padding:1px 10px;font-size:13px;color:var(--muted)}
.prompt{background:var(--prompt);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14px;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.prompt .style{color:var(--muted)}
.actions{display:flex;align-items:center;justify-content:space-between;gap:12px}
.copy{appearance:none;border:0;border-radius:12px;min-height:48px;padding:0 22px;background:var(--accent);color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer;touch-action:manipulation}
.copy.ok{filter:brightness(1.1)}
.check{display:flex;align-items:center;gap:8px;min-height:48px;cursor:pointer;color:var(--muted)}
.check input{width:24px;height:24px;accent-color:var(--done)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.tab{flex:1 1 auto;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:15px;font-weight:700;cursor:pointer;touch-action:manipulation}
.tab[aria-selected="true"]{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<main>
  <h1>Prompts Gemini</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <p class="lead" id="lead"></p>
  <ol class="steps" id="steps"></ol>
  <div class="progress" id="progress" aria-live="polite"></div>
  <div id="list"></div>
</main>

<script src="prompts-carnet.js"></script>
<script>
(function(){
"use strict";
/* Phrase de style de la bible (fiche de commande, étape 0.7), mot pour mot */
const STYLE = "Objet 3D en style jouet, formes rondes et douces, couleurs chaudes et simples, ombrage doux en aplats, univers médiéval-fantastique chaleureux. Un seul objet, entier et centré, vue de trois quarts légèrement en hauteur, sur fond blanc uni, sans texte, sans personnage, sans décor autour.";
/* Pour les créatures (bible, fiche de commande) : « la vue de face remplace la vue de trois quarts, et on retire
   « sans personnage » » */
const STYLE_CREATURE = "Objet 3D en style jouet, formes rondes et douces, couleurs chaudes et simples, ombrage doux en aplats, univers médiéval-fantastique chaleureux. Un seul objet, entier et centré, vue de face, sur fond blanc uni, sans texte, sans décor autour.";
/* Choix de Yo (7 octobre 2026) : les poissons, les fonds marins et les insectes de côté, on voit mieux leur forme */
const STYLE_COTE = "Objet 3D en style jouet, formes rondes et douces, couleurs chaudes et simples, ombrage doux en aplats, univers médiéval-fantastique chaleureux. Un seul objet, entier et centré, vue de côté légèrement en hauteur, sur fond blanc uni, sans texte, sans décor autour.";
const styleDe = c => c.style === "creature" ? STYLE_CREATURE : c.style === "cote" ? STYLE_COTE : STYLE;
const FAMILIES = [
  {name:"Ateliers", items:[
    {id:"scierie", name:"Scierie", size:"moyenne", line:"Une scierie en bois couleur miel, taille moyenne, toit de tuiles orange, roue à eau sur le côté, scie circulaire sur un établi devant, piles de bûches, porte d'entrée bien visible sur la façade avant."},
    {id:"carriere", name:"Carrière", size:"moyenne", line:"Une carrière avec une cabane en bois couleur miel, taille moyenne, toit d'ardoise gris-bleu, blocs de pierre taillés empilés à côté, gros rochers arrondis aux veines de cuivre, lanterne accrochée près de l'entrée, porte d'entrée bien visible sur la façade avant."},
    {id:"forge", name:"Forge", size:"moyenne", line:"Une forge en pierre grise aux angles arrondis, taille moyenne, toit d'ardoise gris-bleu, grosse cheminée de pierre qui fume, lueur orange des braises par une ouverture, enclume et baquet d'eau à côté, porte d'entrée bien visible sur la façade avant."},
    {id:"taverne", name:"Taverne", size:"grande", line:"Une taverne chaleureuse à colombages crème et bois couleur miel, grande taille, toit de tuiles rouges, cheminée de pierre, fenêtres éclairées d'une lumière dorée, enseigne en bois en forme de chope, tonneaux près de l'entrée, porte d'entrée bien visible sur la façade avant."},
    {id:"apothicairerie", name:"Apothicairerie", size:"petite", line:"Une apothicairerie en pierre et bois couleur miel, petite taille, toit d'ardoise gris-bleu, bouquets d'herbes séchées suspendus sous l'avant-toit, fioles colorées en vitrine, petit chaudron à côté, porte d'entrée bien visible sur la façade avant."},
    {id:"tour-des-runes", name:"Tour des runes", size:"petite, haute", line:"Une tour ronde en pierre claire, petite taille mais haute, toit conique d'ardoise bleu nuit, runes gravées qui brillent d'une lueur bleutée sur les pierres, petite fenêtre ronde en haut, porte d'entrée bien visible sur la façade avant."}
  ]},
  {name:"Vie du village", items:[
    {id:"chaumiere", name:"Chaumière", size:"moyenne", line:"Une chaumière douillette aux murs crème et aux poutres de bois couleur miel, taille moyenne, épais toit de chaume doré et arrondi, petite cheminée de pierre, fenêtres à croisillons, pots de fleurs devant, porte d'entrée bien visible sur la façade avant."},
    {id:"marche", name:"Marché", size:"grande", line:"Un marché couvert en bois couleur miel, grande taille, toit de tuiles orange, auvents rayés rouge et crème au-dessus d'étals colorés de fruits et d'étoffes, caisses, tonneaux et balance devant, porte d'entrée bien visible sur la façade avant."},
    {id:"chateau", name:"Château", size:"grande", line:"Un petit château trapu en pierre claire aux formes arrondies, grande taille, quatre tours rondes coiffées de toits coniques d'ardoise bleue, bannières rouge et or, grande porte d'entrée en bois bien visible sur la façade avant."},
    {id:"ferme", name:"Ferme", size:"moyenne", line:"Une ferme en bois couleur miel, taille moyenne, toit de tuiles orange, grande porte de grange, bottes de foin empilées, petit enclos en bois vide à côté, mangeoire, porte d'entrée bien visible sur la façade avant."},
    {id:"entrepot", name:"Entrepôt", size:"moyenne", line:"Un entrepôt en bois couleur miel sur une base de pierre, taille moyenne, toit de tuiles orange, larges portes doubles bien visibles sur la façade avant, caisses et sacs empilés devant, poulie de levage sous le toit."}
  ]},
  {name:"Collections", items:[
    {id:"maison-des-eaux", name:"Maison des eaux", size:"grande", line:"Une maison des eaux en pierre claire et bois couleur miel, grande taille, toit arrondi d'ardoise bleu-vert, grandes fenêtres rondes laissant deviner des bassins, fontaine en forme de coquillage devant, ornements en forme de poissons, porte d'entrée bien visible sur la façade avant."},
    {id:"maison-des-plumes", name:"Maison des plumes", size:"moyenne", line:"Une maison des plumes en bois clair, taille moyenne, toit de tuiles orange en pente douce, nichoirs accrochés aux murs, girouette en forme d'oiseau, grandes fenêtres lumineuses, porte d'entrée bien visible sur la façade avant."},
    {id:"maison-des-ailes", name:"Maison des ailes", size:"moyenne", line:"Une maison des ailes en pierre claire et bois couleur miel, taille moyenne, coiffée d'une verrière arrondie, massifs de fleurs tout autour, enseigne en forme de papillon, porte d'entrée bien visible sur la façade avant."},
    {id:"maison-des-simples", name:"Maison des simples", size:"moyenne", line:"Une maison des simples en pierre et bois couleur miel, taille moyenne, toit couvert de mousse et de plantes, jardinières d'herbes aromatiques aux fenêtres, champignons au pied des murs, plates-bandes devant, porte d'entrée bien visible sur la façade avant."}
  ]},
  {name:"Départs", note:"Sans intérieur, donc sans porte. Tailles proposées, à valider. Le transport sera un modèle à part, d'où le « sans » en fin de ligne.", items:[
    {id:"ponton", name:"Ponton (barque, Marais)", size:"petite", line:"Un ponton en bois couleur miel sur pilotis, petite taille, planches aux bords arrondis, poteau d'amarrage avec une corde enroulée, lanterne sur un piquet, sans bateau."},
    {id:"quai", name:"Quai (navire, Récif)", size:"moyenne", line:"Un quai de pierre claire et de bois couleur miel, taille moyenne, bittes d'amarrage, cordages enroulés, caisses et tonneaux, petite grue en bois, sans bateau."},
    {id:"gare", name:"Gare de wagonnet (Montagnes)", size:"moyenne", line:"Une petite gare de wagonnet en bois couleur miel et pierre, taille moyenne, rails qui entrent dans un tunnel à l'arche arrondie, auvent de tuiles orange au-dessus d'un quai, lanterne, sans wagonnet."},
    {id:"aire-montgolfiere", name:"Aire de montgolfière (Désert)", size:"grande", line:"Une aire de départ de montgolfière, grande taille, plateforme ronde en bois couleur miel, mât d'amarrage avec des cordages, sacs de sable empilés, fanions colorés, sans ballon."},
    {id:"aire-envol", name:"Aire d'envol (griffon, dragon)", size:"grande", line:"Une aire d'envol au sommet d'une tour de pierre claire basse et large, grande taille, plateforme ronde pavée, grand perchoir en bois couleur miel, bannières au vent, abreuvoir, sans créature."}
  ]}
];

/* Meubles et plans de travail (fiche « Prompts Gemini : meubles ») ; id préfixés par m- */
const MEUBLES = [
  {name:"Meubles communs", note:"Ils se posent dans tous les bâtiments. Gabarit : petit (environ 1 P² au sol), moyen (2 P²), grand (4 P²).", items:[
    {id:"m-chaise", name:"Chaise", size:"petit", line:"Une chaise en bois couleur miel, petit gabarit, assise carrée et dossier plein aux coins arrondis, pieds ronds en bois sombre."},
    {id:"m-tabouret", name:"Tabouret", size:"petit", line:"Un tabouret rond en bois couleur miel, petit gabarit, assise épaisse et bombée, trois pieds ronds en bois sombre légèrement écartés."},
    {id:"m-pot", name:"Pot de fleurs", size:"petit", line:"Un pot de fleurs en terre cuite rouge tuile, petit gabarit, rebord épais et arrondi, feuillage vert tendre en boule, petites fleurs rouges, jaunes et blanches."},
    {id:"m-lanterne", name:"Lanterne sur pied", size:"petit", line:"Une lanterne sur pied en bois sombre, petit gabarit, haut poteau sur un socle carré, lanterne allumée d'une lumière dorée sous un petit toit arrondi."},
    {id:"m-tonneau", name:"Tonneau", size:"petit", line:"Un tonneau en bois couleur miel, petit gabarit, ventre bombé, deux cerclages de métal gris, couvercle en bois sombre."},
    {id:"m-statue", name:"Petite statue", size:"petit", line:"Une petite statue en pierre claire, petit gabarit, personnage rond et paisible aux formes lisses, sur un socle carré de pierre grise."},
    {id:"m-coffre", name:"Coffre", size:"moyen", line:"Un coffre en bois couleur miel, gabarit moyen, couvercle bombé, deux cerclages de métal gris, serrure dorée sur le devant."},
    {id:"m-banc", name:"Banc", size:"moyen", line:"Un banc en bois couleur miel, gabarit moyen, longue assise épaisse aux bouts arrondis, deux pieds pleins en bois sombre."},
    {id:"m-etagere", name:"Étagère", size:"moyen", line:"Une étagère en bois couleur miel, gabarit moyen, quatre planches, livres colorés, cruche en terre cuite et petit coffret doré."},
    {id:"m-petit-tapis", name:"Petit tapis", size:"moyen", line:"Un petit tapis rectangulaire rouge tuile, gabarit moyen, centre crème, bords doux, posé à plat sur le sol."},
    {id:"m-table", name:"Table", size:"grand", line:"Une table en bois couleur miel, grand gabarit, plateau épais rectangulaire aux coins arrondis, quatre pieds ronds en bois sombre."},
    {id:"m-grand-tapis", name:"Grand tapis", size:"grand", line:"Un grand tapis rectangulaire bleu ardoise, grand gabarit, large bordure, centre crème avec un médaillon doré, posé à plat sur le sol."}
  ]},
  {name:"Meubles de métier", note:"Ils se posent seulement dans certains bâtiments.", items:[
    {id:"m-lit", name:"Lit (Chaumière)", size:"grand", line:"Un lit en bois couleur miel, grand gabarit, couverture bleu ardoise bien bordée, drap blanc replié, gros oreiller blanc, tête de lit en bois sombre."},
    {id:"m-cheminee", name:"Cheminée (Chaumière, Taverne, Château)", size:"moyen", line:"Une cheminée en pierre claire aux angles arrondis, gabarit moyen, foyer sombre avec un feu orangé, tablette en bois couleur miel, hotte de pierre grise."}
  ]},
  {name:"Plans de travail", note:"Un par bâtiment, construit avec des ressources et posé où l'on veut dans sa pièce.", items:[
    {id:"m-etabli", name:"Établi (Scierie)", size:"moyen", line:"Un établi de menuisier en bois couleur miel, gabarit moyen, plateau épais, étagère basse chargée de planches, étau en bois sombre, scie et pièce de bois posées dessus."},
    {id:"m-atelier-deco", name:"Atelier de décoration (Chaumière)", size:"moyen", line:"Un atelier de décoration en bois couleur miel, gabarit moyen, table avec un petit métier à tisser aux fils colorés, rouleau de tissu rouge, étoffes pliées, pot de peinture."},
    {id:"m-table-taille", name:"Table de taille (Carrière)", size:"moyen", line:"Une table de taille en pierre grise, gabarit moyen, épaisse dalle sur deux gros pieds de pierre, bloc de pierre claire en cours de taille, maillet en bois et ciseau en métal, éclats de pierre."},
    {id:"m-comptoir", name:"Comptoir (Marché)", size:"grand", line:"Un comptoir de marchand, grand gabarit, façade rouge tuile à panneaux crème, plateau en bois couleur miel, balance dorée, cagette de pommes rouges, petite pile de pièces d'or."},
    {id:"m-fourneau", name:"Fourneau (Taverne)", size:"moyen", line:"Un fourneau de cuisine en pierre claire aux formes arrondies, gabarit moyen, bouche de four voûtée aux braises orangées, plaque de cuisson avec une marmite en fonte, petite cheminée."},
    {id:"m-enclume", name:"Enclume (Forge)", size:"petit", line:"Une enclume en métal gris foncé, petit gabarit, forme trapue aux bords adoucis, posée sur un gros billot de bois couleur miel, marteau posé contre le billot."},
    {id:"m-trone", name:"Trône (Château)", size:"moyen", line:"Un trône en bois sombre aux formes arrondies, gabarit moyen, haut dossier et coussin rouges, ornements dorés, posé sur une petite estrade de pierre claire."}
  ]}
];
/* Les onglets : une famille de prompts chacun */
const CATS = {
  batiments:{label:"Bâtiments", families:FAMILIES,
    lead:"Un prompt par bâtiment de la bible, prêt pour Gemini. Chacun commence par la phrase de style de la bible, mot pour mot.",
    steps:["Touche <b>Copier</b>, puis colle dans Gemini.", "Vérifie l'image : un seul bâtiment, entier, fond blanc, vu de trois quarts, porte bien visible.", "Enregistre-la sous le nom du bâtiment (par exemple scierie.png) et coche la case."]},
  meubles:{label:"Meubles", families:MEUBLES,
    lead:"Un prompt par meuble et par plan de travail, prêt pour Gemini. Chacun commence par la phrase de style de la bible, mot pour mot. L'image montre la couleur d'origine du meuble.",
    steps:["Touche <b>Copier</b>, puis colle dans Gemini.", "Vérifie l'image : un seul meuble, entier, fond blanc, vu de trois quarts, le devant bien visible.", "Enregistre-la sous le nom du meuble (par exemple chaise.png) et coche la case."]}
};
/* Tout le Grand Carnet (prompts-carnet.js) : un onglet par famille */
(window.PROMPTS_CARNET || []).forEach(c => { CATS[c.key] = c; });
const TAB_KEY = "le-village-prompts-onglet";
let cat = "batiments";
try{ const v = localStorage.getItem(TAB_KEY); if(CATS[v]) cat = v; }catch(_){}

/* Cases cochées : gardées dans le navigateur du téléphone */
const KEY = "le-village-prompts-faits";
let done = {};
try{ done = JSON.parse(localStorage.getItem(KEY)) || {}; }catch(_){}
function saveDone(){ try{ localStorage.setItem(KEY, JSON.stringify(done)); }catch(_){} }

async function copy(text){
  try{ await navigator.clipboard.writeText(text); return true; }catch(_){}
  const ta = document.createElement("textarea");
  ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  let ok = false;
  try{ ok = document.execCommand("copy"); }catch(_){}
  ta.remove();
  return ok;
}

const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");
function renderProgress(){
  const fams = CATS[cat].families;
  const total = fams.reduce((n, f) => n + f.items.length, 0);
  const n = fams.reduce((c, f) => c + f.items.filter(i => done[i.id]).length, 0);
  document.getElementById("progress").textContent = `${n} sur ${total} images générées`;
}

function render(){
const c = CATS[cat];
document.getElementById("tabs").innerHTML = Object.entries(CATS).map(([k, v]) =>
  `<button class="tab" type="button" role="tab" data-cat="${k}" aria-selected="${k === cat}">${v.label}</button>`).join("");
document.getElementById("lead").textContent = c.lead;
document.getElementById("steps").innerHTML = c.steps.map(t => `<li>${t}</li>`).join("");
document.getElementById("list").innerHTML = c.families.map(f => `
  <h2>${f.name}</h2>${f.note ? `<p class="note">${f.note}</p>` : ""}
  ${f.items.map(i => `
    <section class="card${done[i.id] ? " is-done" : ""}" data-id="${i.id}">
      <div class="head"><h3>${i.name}</h3><span class="size">${i.size}</span></div>
      <p class="prompt"><span class="style">${esc(styleDe(c))}</span>\n${esc(i.line)}</p>
      <div class="actions">
        <button class="copy" type="button">Copier</button>
        <label class="check"><input type="checkbox"${done[i.id] ? " checked" : ""}> Image générée</label>
      </div>
    </section>`).join("")}`).join("");
renderProgress();
}

document.getElementById("tabs").addEventListener("click", e => {
  const t = e.target.closest("[data-cat]");
  if(!t || t.dataset.cat === cat) return;
  cat = t.dataset.cat;
  try{ localStorage.setItem(TAB_KEY, cat); }catch(_){}
  render(); window.scrollTo(0, 0);
});

const byId = {};
Object.values(CATS).forEach(c => c.families.forEach(f => f.items.forEach(i => { byId[i.id] = {line: i.line, style: styleDe(c)}; })));
document.getElementById("list").addEventListener("click", async e => {
  const btn = e.target.closest(".copy");
  if(!btn) return;
  const item = byId[btn.closest(".card").dataset.id];
  const ok = await copy(item.style + "\n" + item.line);
  btn.textContent = ok ? "Copié ✓" : "Échec : sélectionne le texte";
  btn.classList.toggle("ok", ok);
  setTimeout(() => { btn.textContent = "Copier"; btn.classList.remove("ok"); }, 1800);
});
document.getElementById("list").addEventListener("change", e => {
  if(e.target.type !== "checkbox") return;
  const card = e.target.closest(".card");
  done[card.dataset.id] = e.target.checked;
  card.classList.toggle("is-done", e.target.checked);
  saveDone(); renderProgress();
});
render();
})();
</script>
</body>
</html>

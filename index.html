<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Village</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2F6B3A">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="icones/icone-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Pirata+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div class="hud-top">
    <div class="rchips" id="res"></div>
    <div class="hud-droite">
      <button class="plein son" id="btn-son" type="button" aria-label="Le son : volume"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5h3.5L11 5.5v13l-4.5-4H3z"/><path class="ondes" d="M14.5 9a4 4 0 0 1 0 6M17.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="croix" d="M15 9.5l5 5M20 9.5l-5 5"/></svg></button>
      <button class="plein vue" id="btn-vue" type="button" aria-label="Vue à la première personne" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
      <button class="plein nord" id="btn-nord" type="button" aria-label="Remettre la caméra vers le nord" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path class="aiguille" d="M12 3l4.5 9h-9z"/><path d="M12 12v8"/><circle cx="12" cy="12" r="9.5"/></svg></button>
      <button class="plein" id="btn-plein" type="button" aria-label="Plein écran" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path class="ouvrir" d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/><path class="fermer" d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg></button>
      <div class="rchip star" aria-label="Étoiles du village"><b id="stars">★ 0</b></div>
    </div>
  </div>
  <div class="goal-pill" id="goal"></div>
  <button class="meteo" id="meteo" type="button" aria-label="Station météo"></button>
  <div class="coeurs" id="coeurs" hidden></div>
  <div class="vent" id="vent" hidden aria-label="Le vent : la flèche montre où il souffle"><span aria-hidden="true">🍃</span><i aria-hidden="true">➜</i></div>
  <div class="place-hint" id="place-hint" hidden></div>
  <div class="viseur" id="viseur" hidden></div>

  <div class="joy" id="joy" aria-label="Joystick de déplacement"><div class="knob" id="knob"></div></div>
  <div class="barre" id="barre" aria-label="Cases rapides : tes outils"></div>

  <div class="actions" id="actions">
    <button class="act ctx" id="btn-ctx" hidden></button>
    <button class="act ctx" id="btn-plan" hidden></button>
    <button class="act ctx" id="btn-coffre" hidden></button>
    <button class="act ctx" id="btn-vitrine" hidden></button>
    <button class="act ctx" id="btn-torchere" hidden></button>
    <button class="act ctx" id="btn-act" hidden></button>
    <button class="act ctx" id="btn-tracer" hidden></button>
    <button class="act" id="btn-build">🔨 Construire</button>
    <button class="act" id="btn-deco" hidden>🪑 Décorer</button>
    <button class="act" id="btn-sac">🎒 Sac</button>
    <div class="combat" id="combat" hidden>
      <button class="cb attaque" id="btn-attaque" aria-label="Attaquer"><span aria-hidden="true">⚔️</span><small>Attaquer</small></button>
      <button class="cb" id="btn-roulade" aria-label="Roulade"><span aria-hidden="true">🤸</span><small>Roulade</small></button>
      <button class="cb" id="btn-objet" aria-label="Soin : manger un poisson grillé"><span aria-hidden="true">🍢</span><small>Soin <b id="objet-n">0</b></small></button>
    </div>
  </div>
  <div class="actions" id="place-actions" hidden>
    <button class="act primary" id="btn-place">Poser ici</button>
    <button class="act" id="btn-cancel">Annuler</button>
  </div>
  <div class="deco-bar" id="deco-bar" hidden>
    <div class="deco-row" id="deco-sel" hidden>
      <button class="act" id="deco-rot">↻ Tourner</button>
      <button class="act" id="deco-color">🎨 Couleur</button>
      <button class="act" id="deco-store">📥 Ranger</button>
    </div>
    <div class="deco-row">
      <button class="act" id="deco-cat">➕ Meubles</button>
      <button class="act" id="deco-sol">🟫 Sol</button>
      <button class="act" id="deco-murs">🧱 Murs</button>
      <button class="act primary" id="deco-done">Terminé</button>
    </div>
  </div>

  <div class="version" id="version"></div>

  <div class="fatal" id="fatal" hidden><p></p></div>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="aie" id="aie" aria-hidden="true"></div>
<div class="fondu" id="fondu" aria-hidden="true"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>

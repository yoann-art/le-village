<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Village</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=Pirata+One&display=swap" rel="stylesheet">

</head>
<body>
<div id="app">
  <div class="hud-top">
    <div class="rchips" id="res"></div>
    <div class="rchip star" aria-label="Étoiles du village"><b id="stars">★ 0</b></div>
  </div>
  <div class="goal-pill" id="goal"></div>
  <div class="place-hint" id="place-hint" hidden></div>

  <div class="joy" id="joy" aria-label="Joystick de déplacement"><div class="knob" id="knob"></div></div>

  <div class="actions" id="actions">
    <button class="act ctx" id="btn-ctx" hidden></button>
    <button class="act" id="btn-build">🔨 Construire</button>
    <button class="act" id="btn-games">🎲 Mini-jeux</button>
  </div>
  <div class="actions" id="place-actions" hidden>
    <button class="act primary" id="btn-place">Poser ici</button>
    <button class="act" id="btn-cancel">Annuler</button>
  </div>

  <div class="fatal" id="fatal" hidden><p></p></div>
</div>

<div class="sheet-wrap" id="sheetWrap" hidden>
  <div class="backdrop" data-close></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="game" id="game" role="dialog" aria-modal="true" aria-labelledby="g-title" hidden>
  <div class="g-head">
    <div><h2 class="display" id="g-title"></h2><p id="g-sub"></p></div>
    <button class="btn ghost" id="g-quit">Quitter</button>
  </div>
  <div class="g-stage" id="g-stage"></div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
const $ = (s, r=document) => r.querySelector(s);
function fatal(msg){ const f = $("#fatal"); f.hidden = false; $("p", f).textContent = msg; }
if(typeof THREE === "undefined"){ fatal("Le moteur 3D n'a pas pu se charger. Vérifie ta connexion, puis recharge la page."); return; }

/* ================= Données du jeu ================= */
const RES = {
  bois:   {emoji:"🪵", nom:"bois"},
  pierre: {emoji:"🪨", nom:"pierre"},
  or:     {emoji:"🪙", nom:"or"}
};
const B = {
  chaumiere:{nom:"Chaumière", emoji:"🛖", cost:{bois:8, pierre:3}, stars:1, desc:"Loge des villageois. Rapporte des étoiles."},
  scierie:  {nom:"Scierie", emoji:"🪚", cost:{bois:10, or:4}, stars:1, bonus:{res:"bois", pct:25}, desc:"+25 % de bois au Bûcheron, par niveau."},
  carriere: {nom:"Carrière", emoji:"⛏️", cost:{bois:12, or:5}, stars:1, bonus:{res:"pierre", pct:25}, desc:"+25 % de pierre à la Carrière, par niveau."},
  marche:   {nom:"Marché", emoji:"⚖️", cost:{bois:12, pierre:10}, stars:2, bonus:{res:"or", pct:25}, desc:"+25 % d'or aux Runes, par niveau."},
  taverne:  {nom:"Taverne", emoji:"🍺", cost:{bois:18, pierre:12, or:10}, stars:3, all:10, desc:"+10 % sur toutes les récoltes, par niveau."},
  forge:    {nom:"Forge", emoji:"⚒️", cost:{pierre:22, or:8}, stars:3, desc:"Le forgeron équipe le village. Beaucoup d'étoiles."},
  chateau:  {nom:"Château", emoji:"🏰", cost:{bois:45, pierre:60, or:40}, stars:10, unique:true, size:2, desc:"Le cœur du village, sur 2×2 cases. Il couronne ta partie."}
};
const ORDER = ["chaumiere","scierie","carriere","marche","taverne","forge","chateau"];
const GAMES = {
  bucheron:{nom:"Le Bûcheron", cat:"Adresse", color:"sinople", emoji:"🪓", res:"bois", gain:"du bois",
    rules:"Frappe quand le curseur passe dans la zone verte. Au centre doré, c'est un coup parfait. 8 coups.", start:startBucheron},
  carriere:{nom:"La Carrière", cat:"Réflexes", color:"gueules", emoji:"⛏️", res:"pierre", gain:"de la pierre",
    rules:"Touche les pierres avant qu'elles disparaissent. Une gemme vaut 3. Les chauves-souris te volent 2 pierres. 20 secondes.", start:startCarriere},
  runes:{nom:"Les Runes", cat:"Mémoire", color:"azur", emoji:"🔮", res:"or", gain:"de l'or",
    rules:"Regarde la suite de runes, puis reproduis-la. Elle s'allonge à chaque manche. Chaque manche réussie rapporte 2 pièces.", start:startRunes}
};

/* ================= Sauvegarde ================= */
const SAVE_KEY = "le-village-v2-ile", OLD_KEY = "le-village-proto-v1";
function fresh(){ return {v:2, seed:7, res:{bois:15, pierre:8, or:6}, buildings:[], nextId:1, player:{x:.5, z:.5}, crowned:false}; }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if(s && s.v === 2 && s.res && Array.isArray(s.buildings)) return s;
  }catch(e){}
  return null;
}
function migrate(){
  try{
    const o = JSON.parse(localStorage.getItem(OLD_KEY));
    if(!o || !o.res) return null;
    const s = fresh();
    for(const r of Object.keys(RES)) s.res[r] = (o.res[r] || 0);
    (o.grid || []).forEach(c => {
      if(!c || !B[c.type]) return;
      for(const [r,v] of Object.entries(B[c.type].cost)) s.res[r] += v * c.lvl;
    });
    return s;
  }catch(e){ return null; }
}
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }catch(e){} }
let state, migrated = false;
{
  const saved = load();
  if(saved) state = saved;
  else { const m = migrate(); if(m){ state = m; migrated = true; save(); } else state = fresh(); }
}

/* ================= Règles ================= */
const sizeOf = t => B[t].size || 1;
const maxLvl = t => B[t].unique ? 1 : 3;
function upCost(t, lvl){
  const c = {};
  for(const [r,v] of Object.entries(B[t].cost)) c[r] = Math.ceil(v * 1.5 * lvl);
  return c;
}
const canAfford = c => Object.entries(c).every(([r,v]) => state.res[r] >= v);
function pay(c){ for(const [r,v] of Object.entries(c)) state.res[r] -= v; }
const totalStars = () => state.buildings.reduce((s,b) => s + B[b.type].stars * b.lvl, 0);
function mult(r){
  let m = 1;
  for(const b of state.buildings){
    const d = B[b.type];
    if(d.bonus && d.bonus.res === r) m += d.bonus.pct * b.lvl / 100;
    if(d.all) m += d.all * b.lvl / 100;
  }
  return m;
}
const pct = r => Math.round((mult(r) - 1) * 100);
const costHTML = c => Object.entries(c).map(([r,v]) =>
  `<span class="chip ${state.res[r] >= v ? "" : "short"}">${RES[r].emoji} ${v}</span>`).join("");

/* ================= Carte de l'île ================= */
const N = 30, H = N / 2;
const idx = (x,z) => z * N + x;
const inb = (x,z) => x >= 0 && z >= 0 && x < N && z < N;
const tileOf = w => Math.floor(w + H);
const centerOf = t => t - H + .5;
function mulberry32(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function genMap(seed){
  const rnd = mulberry32(seed), G = 5, g1 = [], g2 = [];
  for(let i = 0; i < (G+1)*(G+1); i++){ g1.push(rnd()); g2.push(rnd()); }
  const sm = t => t*t*(3-2*t);
  function noise(g, x, z){
    const fx = x/(N-1)*G, fz = z/(N-1)*G;
    const ix = Math.min(G-1, Math.floor(fx)), iz = Math.min(G-1, Math.floor(fz));
    const tx = sm(fx-ix), tz = sm(fz-iz), w = G+1;
    const a = g[iz*w+ix], b = g[iz*w+ix+1], c = g[(iz+1)*w+ix], d = g[(iz+1)*w+ix+1];
    return (a*(1-tx) + b*tx)*(1-tz) + (c*(1-tx) + d*tx)*tz;
  }
  const type = new Array(N*N), obj = new Array(N*N).fill(null), c = (N-1)/2;
  for(let z = 0; z < N; z++) for(let x = 0; x < N; x++){
    const d = Math.hypot((x-c)/(N/2), (z-c)/(N/2));
    const h = 1 - d*1.2 + (noise(g1,x,z) - .5)*.6;
    let t = h < .1 ? "water" : h < .24 ? "sand" : "grass";
    if(Math.hypot(x-c, z-c) < 3) t = "grass";
    if(Math.hypot(x-(c+6), z-(c-5)) < 1.7 && t === "grass") t = "water";
    type[idx(x,z)] = t;
  }
  for(let z = 0; z < N; z++) for(let x = 0; x < N; x++){
    const i = idx(x,z);
    if(Math.hypot(x-c, z-c) < 3.5) continue;
    const r = rnd();
    if(type[i] === "grass"){
      if((noise(g2,x,z) > .6 && r < .5) || r < .035) obj[i] = "tree";
      else if(r < .06) obj[i] = "rock";
    } else if(type[i] === "sand" && r < .03) obj[i] = "rock";
  }
  return {type, obj};
}
const map = genMap(state.seed);

/* ================= Scène 3D ================= */
const app = $("#app");
let renderer;
try{ renderer = new THREE.WebGLRenderer({antialias:true}); }
catch(e){ fatal("Ton appareil ne permet pas d'afficher la 3D (WebGL indisponible)."); return; }
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.prepend(renderer.domElement);

const SKY = 0xA9E3EC;
const scene = new THREE.Scene();
scene.background = new THREE.Color(SKY);
scene.fog = new THREE.Fog(SKY, 30, 55);
const camera = new THREE.PerspectiveCamera(40, 1, .1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x7a9a6a, .62));
const sun = new THREE.DirectionalLight(0xfff3dc, .82);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
sun.shadow.bias = -0.0008;
scene.add(sun, sun.target);

const MAT = {};
const mat = hex => MAT[hex] || (MAT[hex] = new THREE.MeshLambertMaterial({color:hex}));
const G = {
  box: new THREE.BoxGeometry(1,1,1),
  cyl: new THREE.CylinderGeometry(.5,.5,1,10),
  cone4: new THREE.ConeGeometry(.5,1,4),
  cone: new THREE.ConeGeometry(.5,1,10),
  dode: new THREE.DodecahedronGeometry(.5,0),
  trunk: new THREE.CylinderGeometry(.09,.13,.55,6),
  leaf: new THREE.IcosahedronGeometry(.46,0),
  leaf2: new THREE.IcosahedronGeometry(.3,0),
  head: new THREE.SphereGeometry(.24,16,12),
  hair: new THREE.SphereGeometry(.255,16,8,0,Math.PI*2,0,Math.PI*.5),
  eye: new THREE.SphereGeometry(.03,8,6)
};
function part(geo, material, sx, sy, sz, x, y, z){
  const m = new THREE.Mesh(geo, typeof material === "number" ? mat(material) : material);
  m.scale.set(sx, sy, sz); m.position.set(x, y, z);
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
const roof = (hex, w, h, y, x=0, z=0) => { const m = part(G.cone4, hex, w*1.55, h, w*1.55, x, y + h/2, z); m.rotation.y = Math.PI/4; return m; };

/* Terrain : dalle d'herbe ou de sable sur un socle de terre */
{
  const land = [];
  map.type.forEach((t,i) => { if(t !== "water") land.push(i); });
  const slabs = new THREE.InstancedMesh(new THREE.BoxGeometry(1,.24,1), new THREE.MeshLambertMaterial({color:0xffffff}), land.length);
  const dirt = new THREE.InstancedMesh(new THREE.BoxGeometry(1,.8,1), mat(0xA8774C), land.length);
  const m4 = new THREE.Matrix4(), col = new THREE.Color();
  land.forEach((i,k) => {
    const x = i % N, z = Math.floor(i / N), wx = centerOf(x), wz = centerOf(z), alt = (x+z) % 2;
    m4.makeTranslation(wx, -.12, wz); slabs.setMatrixAt(k, m4);
    m4.makeTranslation(wx, -.64, wz); dirt.setMatrixAt(k, m4);
    col.setHex(map.type[i] === "sand" ? (alt ? 0xEBD793 : 0xF1E0A3) : (alt ? 0x74C063 : 0x7DC96B));
    slabs.setColorAt(k, col);
  });
  slabs.instanceColor.needsUpdate = true;
  slabs.receiveShadow = true; dirt.receiveShadow = true;
  scene.add(slabs, dirt);
}
const water = new THREE.Mesh(new THREE.PlaneGeometry(N+90, N+90),
  new THREE.MeshPhongMaterial({color:0x58C3D8, transparent:true, opacity:.8, shininess:90, specular:0x99DDEE}));
water.rotation.x = -Math.PI/2; water.position.y = -.2; water.receiveShadow = true;
const seabed = new THREE.Mesh(new THREE.PlaneGeometry(N+90, N+90), mat(0x2F93AE));
seabed.rotation.x = -Math.PI/2; seabed.position.y = -1.05;
scene.add(water, seabed);

/* Arbres et rochers */
map.obj.forEach((o,i) => {
  if(!o) return;
  const r = ((i*9301 + 49297) % 233280) / 233280;
  const g = new THREE.Group();
  if(o === "tree"){
    g.add(part(G.trunk, 0x8A5A3B, 1,1,1, 0,.27,0));
    g.add(part(G.leaf, r < .5 ? 0x3E9D50 : 0x479F46, 1,1,1, 0,.82,0));
    g.add(part(G.leaf2, 0x57B25C, 1,1,1, .05,1.18,.02));
    g.scale.setScalar(.85 + r*.35);
  } else {
    g.add(part(G.dode, r < .5 ? 0x9EA3A8 : 0x8F959B, .68,.48,.68, 0,.14,0));
  }
  g.rotation.y = r * 6.28;
  g.position.set(centerOf(i % N), 0, centerOf(Math.floor(i / N)));
  scene.add(g);
});

/* Bâtiments */
const C = {wall:0xF2E2C2, wood:0x8B5A3C, dark:0x654028, straw:0xDDB256, red:0xC8553D, white:0xF4EFE6, blue:0x4E6DB3, stone:0xAEB0B3, stone2:0x8E9195, gold:0xE2B24D};
const emberMat = new THREE.MeshLambertMaterial({color:0xFF7A2E, emissive:0xFF5A00, emissiveIntensity:.7});
const BUILD = {
  chaumiere(g){
    g.add(part(G.box, C.wall, .66,.5,.66, 0,.25,0));
    g.add(roof(C.straw, .66, .5, .5));
    g.add(part(G.box, C.wood, .18,.28,.03, 0,.14,.335));
    g.add(part(G.box, C.blue, .13,.13,.03, .2,.3,.335));
  },
  scierie(g){
    g.add(part(G.box, C.wood, .72,.45,.55, 0,.225,-.08));
    g.add(roof(C.dark, .72, .35, .45, 0, -.08));
    for(let k = 0; k < 3; k++){
      const log = part(G.cyl, C.dark, .12,.55,.12, 0, .06 + (k === 2 ? .1 : 0), .3 + (k === 2 ? 0 : (k ? .06 : -.06)));
      log.rotation.z = Math.PI/2; g.add(log);
    }
  },
  carriere(g){
    g.add(part(G.box, C.wood, .45,.4,.45, -.18,.2,-.12));
    g.add(roof(C.dark, .45, .3, .4, -.18, -.12));
    g.add(part(G.dode, C.stone, .3,.24,.3, .22,.12,.2));
    g.add(part(G.dode, C.stone2, .22,.18,.22, .02,.09,.32));
    g.add(part(G.dode, C.stone, .18,.15,.18, .22,.3,.18));
  },
  marche(g){
    for(const [x,z] of [[-.3,-.22],[.3,-.22],[-.3,.22],[.3,.22]]) g.add(part(G.cyl, C.wood, .05,.6,.05, x,.3,z));
    g.add(part(G.box, C.wood, .66,.07,.46, 0,.3,0));
    for(let k = 0; k < 4; k++) g.add(part(G.box, k % 2 ? C.white : C.red, .2,.05,.56, -.3 + k*.2,.62,0));
    g.add(part(G.box, C.straw, .14,.1,.14, -.15,.39,0));
    g.add(part(G.dode, C.red, .12,.12,.12, .12,.4,.05));
  },
  taverne(g){
    g.add(part(G.box, C.wall, .82,.72,.74, 0,.36,0));
    g.add(part(G.box, C.dark, .84,.06,.76, 0,.4,0));
    g.add(roof(C.red, .82, .5, .72));
    g.add(part(G.box, C.dark, .2,.32,.03, 0,.16,.375));
    g.add(part(G.box, C.gold, .2,.14,.03, .25,.5,.39));
    g.add(part(G.box, C.stone2, .12,.35,.12, .22,1.0,-.15));
  },
  forge(g){
    g.add(part(G.box, C.stone, .78,.5,.68, 0,.25,0));
    g.add(roof(C.dark, .78, .35, .5));
    g.add(part(G.box, C.stone2, .16,.6,.16, .24,.75,-.18));
    g.add(part(G.box, emberMat, .22,.14,.03, 0,.18,.345));
    g.add(part(G.box, C.stone2, .18,.1,.1, .3,.05,.44));
  },
  chateau(g){
    g.add(part(G.box, C.stone, 1.1,1.0,1.1, 0,.5,0));
    g.add(part(G.box, C.stone2, 1.18,.12,1.18, 0,1.06,0));
    for(const [sx,sz] of [[-1,-1],[1,-1],[-1,1],[1,1]]){
      g.add(part(G.cyl, C.stone, .42,1.35,.42, sx*.68,.675,sz*.68));
      g.add(part(G.cone, C.blue, .56,.5,.56, sx*.68,1.6,sz*.68));
    }
    g.add(part(G.box, C.dark, .3,.45,.03, 0,.225,.56));
    g.add(part(G.cyl, C.dark, .03,.5,.03, 0,1.37,0));
    g.add(part(G.box, C.red, .25,.15,.02, .13,1.52,0));
  }
};
function makeBuilding(type, lvl){
  const g = new THREE.Group();
  BUILD[type](g);
  if(maxLvl(type) > 1 && lvl >= 2){
    g.add(part(G.cyl, C.dark, .03,.9,.03, -.38,.45,.38));
    g.add(part(G.box, lvl >= 3 ? C.gold : C.white, .2,.13,.02, -.28,.82,.38));
  }
  g.scale.setScalar(1 + .07 * (lvl - 1));
  return g;
}
const bMeshes = new Map(), occ = new Map();
function footprint(type, x, z){
  const s = sizeOf(type), t = [];
  for(let dz = 0; dz < s; dz++) for(let dx = 0; dx < s; dx++) t.push([x+dx, z+dz]);
  return t;
}
function placeMesh(b){
  if(bMeshes.has(b.id)) scene.remove(bMeshes.get(b.id));
  const s = sizeOf(b.type), g = makeBuilding(b.type, b.lvl);
  g.position.set(b.x - H + s/2, 0, b.z - H + s/2);
  scene.add(g); bMeshes.set(b.id, g);
}
state.buildings.forEach(b => {
  placeMesh(b);
  footprint(b.type, b.x, b.z).forEach(([x,z]) => occ.set(idx(x,z), b.id));
});

/* Personnage */
const player = new THREE.Group(), body = new THREE.Group();
player.add(body);
body.add(part(G.cyl, 0xE0654F, .46,.4,.4, 0,.44,0));
body.add(part(G.head, 0xF2C9A0, 1,1,1, 0,.86,0));
const hair = part(G.hair, 0x6B4226, 1,1,1, 0,.88,-.02); hair.rotation.x = -.3; body.add(hair);
body.add(part(G.eye, 0x1C2230, 1,1,1, -.08,.87,.22));
body.add(part(G.eye, 0x1C2230, 1,1,1, .08,.87,.22));
const legL = part(G.cyl, 0x3B4A6B, .13,.24,.13, -.09,.12,0);
const legR = part(G.cyl, 0x3B4A6B, .13,.24,.13, .09,.12,0);
body.add(legL, legR);
player.scale.setScalar(.78);
scene.add(player);

const R = .26;
function walkable(wx, wz){
  const x = tileOf(wx), z = tileOf(wz);
  if(!inb(x,z)) return false;
  const i = idx(x,z);
  return map.type[i] !== "water" && !map.obj[i] && !occ.has(i);
}
const free = (wx, wz) => walkable(wx-R, wz-R) && walkable(wx+R, wz-R) && walkable(wx-R, wz+R) && walkable(wx+R, wz+R);
player.position.set(state.player.x, 0, state.player.z);
if(!free(player.position.x, player.position.z)) player.position.set(.5, 0, .5);
const facing = {x:0, z:1};

/* ================= Commandes ================= */
const joy = $("#joy"), knob = $("#knob"), JR = 48, jv = {x:0, z:0};
let joyId = null;
function moveJoy(e){
  const r = joy.getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width/2), dy = e.clientY - (r.top + r.height/2);
  const d = Math.hypot(dx, dy);
  if(d > JR){ dx *= JR/d; dy *= JR/d; }
  knob.style.transform = `translate(${dx}px,${dy}px)`;
  if(d < JR * .15){ jv.x = jv.z = 0; } else { jv.x = dx / JR; jv.z = dy / JR; }
}
function endJoy(e){
  if(e.pointerId !== joyId) return;
  joyId = null; jv.x = jv.z = 0; knob.style.transform = "";
}
joy.addEventListener("pointerdown", e => { e.preventDefault(); joyId = e.pointerId; try{ joy.setPointerCapture(e.pointerId); }catch(_){} moveJoy(e); });
joy.addEventListener("pointermove", e => { if(e.pointerId === joyId) moveJoy(e); });
joy.addEventListener("pointerup", endJoy);
joy.addEventListener("pointercancel", endJoy);
const keys = {};
const KEYMAP = {ArrowUp:"u", KeyW:"u", KeyZ:"u", ArrowDown:"d", KeyS:"d", ArrowLeft:"l", KeyA:"l", KeyQ:"l", ArrowRight:"r", KeyD:"r"};
window.addEventListener("keydown", e => {
  if(e.key === "Escape"){ if(!gameEl.hidden) closeGame(); else if(!wrap.hidden) closeSheet(); else if(placing) stopPlacing(); return; }
  if(KEYMAP[e.code] && gameEl.hidden && wrap.hidden){ keys[KEYMAP[e.code]] = 1; e.preventDefault(); }
});
window.addEventListener("keyup", e => { if(KEYMAP[e.code]) keys[KEYMAP[e.code]] = 0; });
window.addEventListener("blur", () => { for(const k in keys) keys[k] = 0; });

/* ================= Boucle de jeu ================= */
const SPEED = 3.4;
let walkT = 0, lastSave = 0, dirty = false;
function dir4(){ return Math.abs(facing.x) > Math.abs(facing.z) ? {x:Math.sign(facing.x), z:0} : {x:0, z:Math.sign(facing.z) || 1}; }
function frontTile(dist){
  const d = dir4();
  return [tileOf(player.position.x + d.x*dist), tileOf(player.position.z + d.z*dist)];
}
function updatePlayer(dt){
  let ix = jv.x, iz = jv.z;
  if(!ix && !iz){
    ix = (keys.r||0) - (keys.l||0); iz = (keys.d||0) - (keys.u||0);
    const l = Math.hypot(ix, iz); if(l){ ix /= l; iz /= l; }
  }
  const mag = Math.min(1, Math.hypot(ix, iz));
  if(mag > 0){
    const sp = SPEED * mag * dt, p = player.position, l = Math.hypot(ix, iz);
    const ux = ix / l, uz = iz / l;
    const nx = p.x + ux * sp, nz = p.z + uz * sp;
    if(free(nx, p.z)) p.x = nx;
    if(free(p.x, nz)) p.z = nz;
    facing.x = ux; facing.z = uz;
    walkT += dt * 11 * mag; dirty = true;
  }
  const target = Math.atan2(facing.x, facing.z);
  let d = target - player.rotation.y; d = Math.atan2(Math.sin(d), Math.cos(d));
  player.rotation.y += d * Math.min(1, dt * 14);
  const sw = mag > 0 ? Math.sin(walkT) : 0;
  body.position.y = mag > 0 ? Math.abs(sw) * .05 : 0;
  legL.rotation.x = sw * .6; legR.rotation.x = -sw * .6;
}
let D = 24;
const OFF = new THREE.Vector3(0, .78, .63).normalize(), camT = new THREE.Vector3();
function resize(){
  const w = app.clientWidth, h = app.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  const tanH = Math.tan(camera.fov * Math.PI / 360) * camera.aspect;
  D = Math.min(28, Math.max(12, 7.2 / (2 * tanH)));
  camera.updateProjectionMatrix();
  scene.fog.near = D + 12; scene.fog.far = D + 48;
  const sb = Math.min(20, D * .75), sc = sun.shadow.camera;
  sc.left = -sb; sc.right = sb; sc.top = sb; sc.bottom = -sb; sc.near = 1; sc.far = 70;
  sc.updateProjectionMatrix();
}
window.addEventListener("resize", resize);
resize();
camT.copy(player.position);

let last = performance.now();
function tick(now){
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if(gameEl.hidden){
    if(wrap.hidden) updatePlayer(dt);
    camT.lerp(player.position, 1 - Math.pow(.0005, dt));
    camera.position.copy(camT).addScaledVector(OFF, D);
    camera.lookAt(camT.x, .4, camT.z);
    sun.position.set(camT.x + 6, 16, camT.z + 5);
    sun.target.position.copy(camT);
    water.position.y = -.2 + Math.sin(now * .0012) * .02;
    updateInteraction();
    renderer.render(scene, camera);
    if(dirty && now - lastSave > 2000){
      state.player = {x:+player.position.x.toFixed(2), z:+player.position.z.toFixed(2)};
      save(); lastSave = now; dirty = false;
    }
  }
  requestAnimationFrame(tick);
}

/* ================= Construire ================= */
let placing = null, ghost = null, ghostOk = false, ghostAt = null;
const ghostMat = new THREE.MeshBasicMaterial({color:0xFFFFFF, transparent:true, opacity:.6, depthWrite:false});
const baseMat = new THREE.MeshBasicMaterial({color:0xFFE27A, transparent:true, opacity:.55, depthWrite:false});
function anchorFor(type){
  const s = sizeOf(type), d = dir4(), [fx, fz] = frontTile(1.3);
  if(s === 1) return [fx, fz];
  const ax = d.x > 0 ? fx : d.x < 0 ? fx - 1 : Math.round(player.position.x + H) - 1;
  const az = d.z > 0 ? fz : d.z < 0 ? fz - 1 : Math.round(player.position.z + H) - 1;
  return [ax, az];
}
function canPlace(type, ax, az){
  return footprint(type, ax, az).every(([x,z]) => {
    if(!inb(x,z)) return false;
    const i = idx(x,z);
    return map.type[i] !== "water" && !map.obj[i] && !occ.has(i);
  });
}
function startPlacing(type){
  placing = type;
  ghost = makeBuilding(type, 1);
  ghost.traverse(o => { if(o.isMesh){ o.material = ghostMat; o.castShadow = false; o.receiveShadow = false; } });
  const s = sizeOf(type);
  const base = new THREE.Mesh(new THREE.PlaneGeometry(s, s), baseMat);
  base.rotation.x = -Math.PI/2; base.position.y = .02;
  ghost.add(base);
  scene.add(ghost);
  $("#actions").hidden = true; $("#place-actions").hidden = false; $("#place-hint").hidden = false;
}
function stopPlacing(){
  if(ghost) scene.remove(ghost);
  placing = null; ghost = null;
  $("#actions").hidden = false; $("#place-actions").hidden = true; $("#place-hint").hidden = true;
}
function updateInteraction(){
  if(placing){
    const [ax, az] = anchorFor(placing), s = sizeOf(placing);
    ghostOk = canPlace(placing, ax, az); ghostAt = [ax, az];
    ghost.position.set(ax - H + s/2, 0, az - H + s/2);
    ghostMat.color.setHex(ghostOk ? 0xFFFFFF : 0xE4776C); baseMat.color.setHex(ghostOk ? 0xFFE27A : 0xE4776C);
    const hint = $("#place-hint"), btn = $("#btn-place");
    const txt = ghostOk ? `${B[placing].emoji} ${B[placing].nom} : place libre` : `${B[placing].emoji} Terrain occupé, avance ailleurs`;
    if(hint.textContent !== txt){ hint.textContent = txt; hint.classList.toggle("bad", !ghostOk); }
    btn.disabled = !ghostOk;
    return;
  }
  let id = null;
  for(const dist of [.8, 1.3]){
    const [x,z] = frontTile(dist);
    if(inb(x,z) && occ.has(idx(x,z))){ id = occ.get(idx(x,z)); break; }
  }
  const ctx = $("#btn-ctx");
  if(id === null){ if(!ctx.hidden) ctx.hidden = true; ctx.dataset.id = ""; return; }
  if(ctx.dataset.id !== String(id) || ctx.hidden){
    const b = state.buildings.find(v => v.id === id);
    ctx.textContent = `${B[b.type].emoji} ${B[b.type].nom}`;
    ctx.dataset.id = String(id); ctx.hidden = false;
  }
}
$("#btn-cancel").addEventListener("click", stopPlacing);
$("#btn-place").addEventListener("click", () => {
  if(!placing || !ghostOk) return;
  const type = placing, d = B[type];
  if(!canAfford(d.cost)){ toast("Ressources insuffisantes"); stopPlacing(); return; }
  const [ax, az] = ghostAt;
  pay(d.cost);
  const b = {id:state.nextId++, type, lvl:1, x:ax, z:az};
  state.buildings.push(b);
  footprint(type, ax, az).forEach(([x,z]) => occ.set(idx(x,z), b.id));
  placeMesh(b);
  stopPlacing(); save(); renderHUD();
  toast(`${d.nom} construit`);
  if(type === "chateau" && !state.crowned){
    state.crowned = true; save(); renderHUD();
    setTimeout(() => openSheet(`<div class="crown"><div class="intro-emoji">🏰</div><h2 class="display">Ton village est couronné</h2>
      <p>${totalStars()} ★ au compteur. Continue d'améliorer tes bâtiments pour gagner encore des étoiles.</p>
      <button class="btn primary" data-close>Admirer mon île</button></div>`), 600);
  }
});

/* ================= Interface ================= */
function renderHUD(){
  $("#res").innerHTML = Object.entries(RES).map(([k,r]) =>
    `<div class="rchip" id="r-${k}" aria-label="${state.res[k]} ${r.nom}"><span aria-hidden="true">${r.emoji}</span><b>${state.res[k]}</b></div>`).join("");
  $("#stars").textContent = "★ " + totalStars();
  const g = $("#goal");
  if(state.crowned){ g.textContent = "Village couronné"; return; }
  g.innerHTML = "Château : " + Object.entries(B.chateau.cost).map(([r,v]) => {
    const have = Math.min(state.res[r], v);
    return `<span class="${have >= v ? "ok" : ""}">${RES[r].emoji} ${have}/${v}</span>`;
  }).join(" ");
}
function pulse(r){ const el = $("#r-" + r); if(!el) return; el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
let toastT = 0;
function toast(msg, ms=2400){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms);
}
const wrap = $("#sheetWrap"), sheet = $("#sheet");
function openSheet(html){
  sheet.innerHTML = html; wrap.hidden = false;
  jv.x = jv.z = 0; knob.style.transform = "";
  requestAnimationFrame(() => requestAnimationFrame(() => wrap.classList.add("open")));
}
function closeSheet(){ wrap.classList.remove("open"); setTimeout(() => { wrap.hidden = true; }, 220); }

$("#btn-build").addEventListener("click", () => {
  openSheet(`<div class="sh-head"><h2 class="display">Que veux-tu bâtir ?</h2><button class="btn ghost" data-close>Fermer</button></div>
    <p class="muted" style="margin:0 0 6px">Tu choisis, puis tu te places : le bâtiment se pose devant toi.</p>` +
    ORDER.map(t => {
      const b = B[t], built = b.unique && state.buildings.some(v => v.type === t), ok = !built && canAfford(b.cost);
      return `<div class="brow"><div class="be" aria-hidden="true">${b.emoji}</div>
        <div class="bt"><span class="bn">${b.nom}</span><span class="st">★ ${b.stars}</span><p>${b.desc}</p><div>${costHTML(b.cost)}</div></div>
        <button class="btn primary" data-pick="${t}" ${ok ? "" : "disabled"}>${built ? "Déjà bâti" : "Choisir"}</button></div>`;
    }).join(""));
});
$("#btn-games").addEventListener("click", () => {
  openSheet(`<div class="sh-head"><h2 class="display">Mini-jeux</h2><button class="btn ghost" data-close>Fermer</button></div>
    <p class="muted" style="margin:0 0 10px">Chaque mini-jeu rapporte une ressource. Tes bâtiments augmentent les gains.</p>` +
    Object.entries(GAMES).map(([id,g]) => {
      const p = pct(g.res);
      return `<button class="game-row" data-game="${id}" style="--cat:var(--${g.color})">
        <span class="gi" aria-hidden="true">${g.emoji}</span>
        <span class="gt"><span class="tag">${g.cat}</span><span class="gname display">${g.nom}</span>
        <span class="gdesc">Rapporte ${g.gain} ${RES[g.res].emoji}${p ? `, bonus +${p} %` : ""}</span></span></button>`;
    }).join("") +
    `<div class="game-row locked" style="--cat:var(--or)"><span class="gi" aria-hidden="true">⚔️</span>
      <span class="gt"><span class="tag">Épique</span><span class="gname display">La Joute</span>
      <span class="gdesc">Bientôt : un duel qui rapporte des ressources rares.</span></span></div>
    <button class="reset" data-reset>Effacer la partie</button>`);
});
$("#btn-ctx").addEventListener("click", () => {
  const id = +$("#btn-ctx").dataset.id;
  const b = state.buildings.find(v => v.id === id);
  if(b) openDetail(b);
});
let detailId = null;
function openDetail(b){
  detailId = b.id;
  const d = B[b.type], max = maxLvl(b.type);
  let effect = "Rapporte des étoiles au village.";
  if(d.bonus) effect = `Bonus actuel : +${d.bonus.pct * b.lvl} % de ${RES[d.bonus.res].nom}.`;
  if(d.all) effect = `Bonus actuel : +${d.all * b.lvl} % sur toutes les récoltes.`;
  let up = `<p class="muted" style="margin-top:12px">Niveau maximum atteint.</p>`;
  if(b.lvl < max){
    const c = upCost(b.type, b.lvl);
    up = `<div class="upbox"><div><p>Passer au niveau ${b.lvl + 1}</p><div>${costHTML(c)}</div></div>
      <button class="btn primary" data-up ${canAfford(c) ? "" : "disabled"}>Améliorer</button></div>`;
  }
  openSheet(`<div class="sh-head"><h2 class="display">${d.emoji} ${d.nom}</h2><button class="btn ghost" data-close>Fermer</button></div>
    <p style="margin:4px 0">Niveau ${b.lvl} sur ${max}, ${d.stars * b.lvl} ★ pour ton village.</p>
    <p class="muted" style="margin:0">${effect}</p>${up}`);
}
wrap.addEventListener("click", e => {
  if(e.target.closest("[data-close]")){ closeSheet(); return; }
  const pick = e.target.closest("[data-pick]");
  if(pick){ closeSheet(); startPlacing(pick.dataset.pick); return; }
  const gm = e.target.closest("[data-game]");
  if(gm){ closeSheet(); setTimeout(() => openGame(gm.dataset.game), 150); return; }
  if(e.target.closest("[data-up]")){
    const b = state.buildings.find(v => v.id === detailId);
    if(!b || b.lvl >= maxLvl(b.type)) return;
    const c = upCost(b.type, b.lvl);
    if(!canAfford(c)) return;
    pay(c); b.lvl++; placeMesh(b); save(); renderHUD(); closeSheet();
    toast(`${B[b.type].nom} amélioré au niveau ${b.lvl}`);
    return;
  }
  if(e.target.closest("[data-reset]")){
    if(confirm("Effacer ton île et repartir de zéro ?")){
      try{ localStorage.removeItem(SAVE_KEY); localStorage.removeItem(OLD_KEY); }catch(_){}
      location.reload();
    }
  }
});

/* ================= Mini-jeux ================= */
const gameEl = $("#game"), stage = $("#g-stage");
let current = null, cleanup = null;
function openGame(id){
  current = id;
  const g = GAMES[id], p = pct(g.res);
  $("#g-title").textContent = g.nom;
  $("#g-sub").textContent = `${g.cat}, rapporte ${g.gain}`;
  stage.innerHTML = `<div class="intro-emoji" aria-hidden="true">${g.emoji}</div><p class="rules">${g.rules}</p>
    ${p ? `<p class="bonus-line">Bonus de ton village : +${p} %</p>` : ""}
    <button class="btn primary big" id="go">Commencer</button>`;
  gameEl.hidden = false;
  jv.x = jv.z = 0; knob.style.transform = "";
  $("#go").addEventListener("click", () => { cleanup = g.start(stage, finish); });
}
function stopGame(){ if(cleanup){ cleanup(); cleanup = null; } }
function closeGame(){ stopGame(); gameEl.hidden = true; last = performance.now(); }
$("#g-quit").addEventListener("click", closeGame);
function finish(raw){
  stopGame();
  const g = GAMES[current], m = mult(g.res), gain = Math.round(raw * m);
  state.res[g.res] += gain; save(); renderHUD();
  stage.innerHTML = `<p class="muted" style="margin:0">${gain ? "Ta récolte" : "Rien cette fois"}</p>
    <p class="gain display">+${gain} ${RES[g.res].emoji}</p>
    <p class="muted" style="margin:0">Score ${raw}${m > 1 ? `, bonus du village +${Math.round((m-1)*100)} %` : ""}</p>
    <div class="stack"><button class="btn primary big" id="back">Retour sur l'île</button>
    <button class="btn ghost" id="again">Rejouer</button></div>`;
  $("#back").addEventListener("click", () => { closeGame(); pulse(g.res); });
  $("#again").addEventListener("click", () => openGame(current));
}
function onPress(el, fn){
  el.addEventListener("pointerdown", e => { e.preventDefault(); fn(); });
  el.addEventListener("click", e => { if(e.detail === 0) fn(); });
}

function startBucheron(stage, done){
  stage.innerHTML = `<div class="tree" id="tree" aria-hidden="true">🌲</div>
    <div class="meter" aria-hidden="true"><div class="zone" id="zone"><div class="perfect"></div></div><div class="cursor" id="cursor"></div></div>
    <p class="feedback display" id="fb" aria-live="polite">&nbsp;</p>
    <p class="count" id="cnt"></p>
    <button class="btn primary big" id="hit">Frapper</button>`;
  const zone = $("#zone",stage), cur = $("#cursor",stage), fb = $("#fb",stage), cnt = $("#cnt",stage), tree = $("#tree",stage);
  const SW = 8, T = [];
  let swing = 0, total = 0, dur = 1.15, zw = .24, zx = .4, p = 0, dir = 1, last = performance.now(), raf = 0, lock = false, over = false;
  function newZone(){ zx = .05 + Math.random() * (.9 - zw); zone.style.left = zx*100 + "%"; zone.style.width = zw*100 + "%"; }
  function upd(){ cnt.textContent = over ? `Total : ${total} bois` : `Coup ${swing + 1} sur ${SW}, ${total} bois`; }
  function frame(now){
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    p += dir * dt / dur;
    if(p > 1){ p = 2 - p; dir = -1; }
    if(p < 0){ p = -p; dir = 1; }
    cur.style.left = (p * 100) + "%";
    raf = requestAnimationFrame(frame);
  }
  function hit(){
    if(lock || over) return;
    const c = zx + zw/2, inside = p >= zx && p <= zx + zw, perfect = Math.abs(p - c) <= zw * .17;
    const pts = perfect ? 4 : inside ? 2 : 0;
    total += pts;
    fb.textContent = perfect ? "Parfait ! +4" : inside ? "Bien ! +2" : "Raté";
    fb.style.color = perfect ? "var(--or)" : inside ? "var(--sinople)" : "var(--gueules)";
    if(pts){ tree.classList.remove("shake"); void tree.offsetWidth; tree.classList.add("shake"); }
    swing++;
    if(swing >= SW){ over = true; upd(); T.push(setTimeout(() => done(total), 800)); return; }
    dur = Math.max(.5, dur - .075); zw = Math.max(.11, zw - .016);
    lock = true;
    T.push(setTimeout(() => { lock = false; newZone(); }, 220));
    upd();
  }
  onPress($("#hit",stage), hit);
  newZone(); upd();
  raf = requestAnimationFrame(frame);
  return () => { cancelAnimationFrame(raf); T.forEach(clearTimeout); };
}

function startCarriere(stage, done){
  stage.innerHTML = `<div class="qhead display"><span id="qs">🪨 0</span><span id="qt">20 s</span></div>
    <div class="timer" aria-hidden="true"><i id="bar"></i></div>
    <div class="holes">${'<button class="hole" aria-label="Trou de la carrière"><span class="em"></span></button>'.repeat(9)}</div>`;
  const KIND = {rock:{e:"🪨", v:1}, gem:{e:"💎", v:3}, bat:{e:"🦇", v:-2}};
  const holes = [...stage.querySelectorAll(".hole")].map(el => ({el, kind:null, until:0}));
  const qs = $("#qs",stage), qt = $("#qt",stage), bar = $("#bar",stage);
  const DUR = 20000, t0 = performance.now();
  let next = t0 + 400, score = 0, raf = 0, over = false, endT = 0;
  function show(h, k, now, life){ h.kind = k; h.until = now + life; $(".em", h.el).textContent = KIND[k].e; h.el.classList.add("up"); }
  function hide(h){ h.kind = null; h.el.classList.remove("up"); }
  function floatText(el, txt, color){
    const s = document.createElement("span");
    s.className = "float"; s.textContent = txt; s.style.color = color;
    el.appendChild(s); setTimeout(() => s.remove(), 700);
  }
  function frame(now){
    const el = now - t0, prog = Math.min(1, el / DUR);
    bar.style.width = ((1 - prog) * 100) + "%";
    qt.textContent = Math.max(0, Math.ceil((DUR - el) / 1000)) + " s";
    for(const h of holes) if(h.kind && now > h.until) hide(h);
    if(el >= DUR){
      over = true; holes.forEach(hide);
      endT = setTimeout(() => done(score), 600);
      return;
    }
    if(now >= next){
      const free = holes.filter(h => !h.kind);
      if(free.length){
        const h = free[Math.floor(Math.random() * free.length)], r = Math.random();
        show(h, r < .1 ? "gem" : r < .28 ? "bat" : "rock", now, 1050 - 400 * prog);
      }
      next = now + (720 - 300 * prog) * (.7 + Math.random() * .6);
    }
    raf = requestAnimationFrame(frame);
  }
  holes.forEach(h => onPress(h.el, () => {
    if(over || !h.kind) return;
    const v = KIND[h.kind].v;
    score = Math.max(0, score + v);
    qs.textContent = "🪨 " + score;
    floatText(h.el, (v > 0 ? "+" : "") + v, v > 0 ? "var(--or)" : "var(--gueules)");
    hide(h);
  }));
  raf = requestAnimationFrame(frame);
  return () => { cancelAnimationFrame(raf); clearTimeout(endT); };
}

function startRunes(stage, done){
  const R = [{e:"🔥", c:"var(--gueules)"}, {e:"💧", c:"var(--azur)"}, {e:"🌿", c:"var(--sinople)"}, {e:"⭐", c:"var(--or)"}];
  stage.innerHTML = `<p class="round display" id="rd">Manche 1</p><p class="status" id="st" aria-live="polite"></p>
    <div class="runes">${R.map((r,i) => `<button class="rune" data-i="${i}" style="--c:${r.c}" aria-label="Rune ${i+1}" disabled>${r.e}</button>`).join("")}</div>`;
  const btns = [...stage.querySelectorAll(".rune")], rd = $("#rd",stage), st = $("#st",stage), T = [];
  let seq = [], idx = 0, round = 0, won = 0, accept = false, over = false;
  const later = (f, ms) => T.push(setTimeout(f, ms));
  function lit(i, ms){ btns[i].classList.add("lit"); later(() => btns[i].classList.remove("lit"), ms); }
  function setInput(on){ accept = on; btns.forEach(b => b.disabled = !on); }
  function nextRound(){
    round++; idx = 0;
    seq.push(Math.floor(Math.random() * 4));
    rd.textContent = `Manche ${round}`;
    st.textContent = "Regarde bien…";
    setInput(false);
    const gap = Math.max(360, 700 - round * 30);
    seq.forEach((k, j) => later(() => lit(k, gap * .62), 600 + j * gap));
    later(() => { st.textContent = "À toi"; setInput(true); }, 600 + seq.length * gap);
  }
  function press(k){
    if(!accept || over) return;
    lit(k, 180);
    if(k !== seq[idx]){
      over = true; setInput(false);
      st.textContent = `Raté ! ${won} manche${won > 1 ? "s" : ""} réussie${won > 1 ? "s" : ""}`;
      later(() => done(won * 2), 1000);
      return;
    }
    idx++;
    if(idx === seq.length){
      won = round; setInput(false);
      if(round >= 12){ over = true; st.textContent = "Mémoire parfaite !"; later(() => done(won * 2 + 6), 1000); return; }
      st.textContent = "Bien joué";
      later(nextRound, 800);
    }
  }
  btns.forEach(b => onPress(b, () => press(+b.dataset.i)));
  later(nextRound, 300);
  return () => T.forEach(clearTimeout);
}


/* ================= Démarrage ================= */
renderHUD();
requestAnimationFrame(tick);
setTimeout(() => {
  if(migrated) toast("Tes ressources du prototype sont récupérées, et tes anciens bâtiments remboursés.", 4200);
  else if(!state.buildings.length) toast("Déplace-toi avec le joystick. Touche Construire pour bâtir devant toi.", 4200);
}, 700);
})();

# Vérification du jeu, à chaque envoi sur GitHub (gratuit pour un dépôt public).
# Un robot ouvre le jeu dans un navigateur sans écran et joue les gestes de base (tests/verif-page.js).
# Résultat : une coche verte (tout va bien) ou une croix rouge (quelque chose est cassé), dans l'onglet
# « Actions » du dépôt ; une capture d'écran est gardée avec le résultat. Le détail (gestes réussis ou erreurs)
# est écrit en « annotations », lisibles sans compte : c'est là que Claude le lit, depuis le PC de Yo.
name: Vérification du jeu

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 20   # 10 minutes ne suffisaient plus à la machine de GitHub (26 octobre 2026, v2.1.60) ; 15 non plus une fois (Yo, 4 novembre 2026)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installer le navigateur de test
        run: |
          # en cas d'échec, la fin du journal en annotation (lisible sans compte : Claude la lit depuis le PC de Yo)
          { npm install --no-save playwright@1.64.1 && npx playwright install --with-deps chromium; } > installation.log 2>&1 || {
            echo "::error title=Installation du navigateur de test::$(tail -n 40 installation.log | cut -c1-200 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            exit 1
          }
      - name: Lancer le jeu et jouer les gestes de base
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          sleep 2
          node tests/verif.mjs
      - name: Garder la capture d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capture
          path: capture.png
          if-no-files-found: ignore
